name: Wire prayer auto advance

on:
  push:
    branches:
      - agent/prayer-auto-advance-final

permissions:
  contents: write

jobs:
  wire:
    if: "${{ !contains(github.event.head_commit.message, '[auto-wired]') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/prayer-auto-advance-final
          fetch-depth: 0

      - name: Patch PrayerFlowView
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('MargaretkaApp/PrayerFlowView.swift')
          text = path.read_text()
          needle = '        .safeNavigationChrome(isFullscreen: isFullscreen || isIPad)\n'
          replacement = '''        .safeNavigationChrome(isFullscreen: isFullscreen || isIPad)
        .prayerAutoAdvanceFlow(
            activeIndex: $activeIndex,
            steps: prayerSteps,
            prayersByID: allPrayers,
            flowID: selectedPriest?.id,
            languageCode: selectedPriest?.title,
            automaticTargetIndex: min(
                (visiblePrayerStepIndices.last.map { $0 + 1 } ?? activeIndex) + 1,
                lastDisplayIndex
            ),
            lastDisplayIndex: lastDisplayIndex,
            moveToIndex: { index in
                moveToIndex(index, animated: true)
            }
        )
'''
          count = text.count(needle)
          if count != 1:
              raise SystemExit(f'Expected exactly one PrayerFlowView insertion marker, found {count}')
          path.write_text(text.replace(needle, replacement, 1))
          PY

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/prayer-auto-advance-wire.yml
          git add MargaretkaApp/PrayerFlowView.swift
          git commit -m "[auto-wired] Wire prayer auto advance into flow"
          git push origin HEAD:agent/prayer-auto-advance-final
